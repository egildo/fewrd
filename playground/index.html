<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>fewrd playground</title>
    <!-- Dev-time only, the library stays dependency-free: Inter for the UI, JetBrains Mono for the grid and the editor (positions must be legible),
         Material Symbols Rounded for ten icons. The playground's own CSS falls back to system fonts and text glyphs when these do not load. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400..600,0,0&icon_names=check,chevron_left,chevron_right,contrast,dark_mode,data_object,expand_more,light_mode,visibility,visibility_off&display=block" rel="stylesheet" />
    <style>
      :root { color-scheme: light dark; }
      body { margin: 0; }
      #app { min-height: 100vh; }
    </style>
  </head>
  <body>
    <main id="app"></main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
